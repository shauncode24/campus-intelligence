# Weekly pull requests for out-of-date dependencies. CI runs on each of them, so a bump that
# breaks something shows up as a red check instead of a surprise. Review and merge by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /firestore-tests
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /backend/python
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /backend/python
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
